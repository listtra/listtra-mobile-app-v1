appId: com.zirkly.app
---
# Test the forgot-password entry flow. Stops at the OTP screen because we
# can't read the emailed code in CI (same constraint as signup.yaml).

- launchApp:
    clearState: true

# Expo dev launcher → load Metro bundle
- tapOn:
    text: "http://localhost:8081"
    optional: true
- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    point: "92%,42%"
    optional: true

# Open auth modal in Sign-In mode
- tapOn: "Sell now →"
- tapOn: "Sign In"

# Trigger the forgot-password switch
- tapOn: "Forgot password?"

# ForgotPasswordForm renders — assert the heading is up
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 10000

- tapOn: "Enter your email"
- inputText: "jibinbkp02@gmail.com"

- tapOn: "Send OTP"

# Successful submit switches to the OTP verification screen — assert by heading
- extendedWaitUntil:
    visible: "Verification OTP"
    timeout: 15000

# Confirm the email we typed is displayed in the OTP screen prompt
- assertVisible: "jibinbkp02@gmail.com"

# Stop here — completing OTP would require reading the emailed code.
